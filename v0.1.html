<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronicles of Solaria</title>
    <style>
        body {
            background-color: #1a1a1a; /* Darker background for contrast */
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: #202020; 
            border: 12px solid #333;
            border-radius: 10px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.7);
            overflow: hidden; /* Keeps the map inside bounds */
        }
        canvas { image-rendering: pixelated; }
        
        /* BATTLE UI STYLING (Updated Colors) */
        #battle-screen {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #e0f8d0; /* Classic light battle background */
            color: #081820;
            box-sizing: border-box;
            padding: 20px;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }
        .retro-button {
            background-color: #58c07c;
            color: white;
            border: 2px solid #081820;
            padding: 10px;
            font-family: inherit;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .retro-button:hover { background-color: #388850; }
        #message-box {
            background: white;
            border: 3px solid #081820;
            padding: 10px;
            min-height: 45px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 3px solid #081820;
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        #map-name-display {
            position: absolute;
            top: 10px; left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #58c07c;
            padding: 6px 12px;
            font-weight: bold;
            display: none;
            border: 2px solid #58c07c;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1>Chronicles of Solaria</h1>
    <p>Use W, A, S, D to move. Now in Full Color with Animations!</p>

    <div id="game-container">
        <div id="map-name-display">Oakhaven Town</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="battle-screen">
            <div class="hud">
                <div>
                    <div>Wild <span id="enemy-name"></span></div>
                    <div>HP: <span id="enemy-hp"></span></div>
                </div>
                <div>
                    <div><span id="player-aetheron-name"></span></div>
                    <div>HP: <span id="player-hp"></span></div>
                </div>
            </div>
            <h1 id="enemy-sprite" style="font-size: 80px; text-align: center; margin: 0;">❓</h1>
            <div id="message-box">A wild Aetheron appeared!</div>
            <div style="display: flex; justify-content: space-between;">
                <button class="retro-button" style="flex-grow: 1;" onclick="attack()">Attack</button>
                <button class="retro-button" style="flex-grow: 1;" onclick="run()">Run</button>
            </div>
        </div>
    </div>

    <script>
        const aetheronDatabase = {
            1: { id: 1, name: "Sproutling", type: "Flora", baseHp: 45, baseAtk: 49, sprite: "🌱" },
            2: { id: 2, name: "Ignipup", type: "Fire", baseHp: 39, baseAtk: 52, sprite: "🔥" },
            3: { id: 3, name: "Aquafloat", type: "Aqua", baseHp: 44, baseAtk: 48, sprite: "💧" }
        };

        let playerState = {
            party: [{ id: 2, name: "Ignipup", currentHp: 20, maxHp: 20, attack: 12 }]
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const tileSize = 40; 
        
        // ==========================================
        // NEW: MULTI-COLOR PALETTE ENGINE
        // ==========================================
        const palettes = {
            'player': { '1': '#ffcccc', '2': '#ee3333', '3': '#3333ff', '4': '#000000' }, // Skin, Shirt, Pants, Outline
            'nature': { '1': '#A0D080', '2': '#58c07c', '3': '#388850', '4': '#081820' }, // Grass Light, Grass Med, Trees, Outline
            'water':  { '1': '#a0e8f0', '2': '#28ccdf', '3': '#0a80a0', '4': '#081820' }, // Light blue, Med blue, Dark blue, Outline
            'building':{ '1': '#f0f0f0', '2': '#c0c0c0', '3': '#800000', '4': '#081820' }, // Walls, Shade, Roof, Outline
            'path':   { '1': '#f8e8b0', '2': '#e0c8a0', '3': '#b09070', '4': '#081820' }  // Sand, Dirt, Shadow, Outline
        };

        // Redesigned tiles with color mapping ('.' is transparent)
        const tileset = {
            // Path (Uses path palette)
            0: { palette: 'path', pixels: [
                "11111111",
                "11111111",
                "11211111",
                "11111112",
                "11111111",
                "11112111",
                "12111111",
                "11111111"
            ]},
            // Tall Grass (Uses nature palette)
            1: { palette: 'nature', pixels: [
                "........",
                "........",
                ".4....4.",
                "424..424",
                "43244234",
                "43333334",
                ".444444.",
                "........"
            ]},
            // Tree (Uses nature palette)
            2: { palette: 'nature', pixels: [
                "..4444..",
                ".433334.",
                "43233234",
                "43333334",
                "43344334",
                ".443344.",
                "..4334..",
                "..4444.."
            ]},
            // Transition Mat (Uses path palette)
            3: { palette: 'path', pixels: [
                "........",
                ".444444.",
                "43333334",
                "43222234",
                "43222234",
                "43333334",
                ".444444.",
                "........"
            ]},
            // House Wall (Uses building palette)
            4: { palette: 'building', pixels: [
                "44444444",
                "41111114",
                "41111114",
                "42222224",
                "42222224",
                "44444444",
                "42222224",
                "44444444"
            ]},
            // Water (Uses water palette)
            5: { palette: 'water', pixels: [
                "22222222",
                "22442222",
                "24114222",
                "22222222",
                "22222442",
                "22224114",
                "22222222",
                "22222222"
            ]},
            // NEW: House Roof Tile (Uses building palette)
            6: { palette: 'building', pixels: [
                "....44..",
                "..44334.",
                ".4333334",
                "43333334",
                "43333334",
                "44444444",
                "........",
                "........"
            ]}
        };

        // ==========================================
        // NEW: PLAYER ANIMATION FRAMES
        // ==========================================
        const playerSprites = {
            palette: 'player',
            // Simple 2-frame animation logic implemented in draw
            'down': [
                ["..4444..",".411114.","..4224..",".433334.","24233242","24233242","..4334..",".44..44."], // Frame 1
                ["..4444..",".411114.","..4224..",".433334.","24233242","24233242","..44..4.","...44..."]  // Frame 2 (waddle)
            ],
            'up': [
                ["..4444..",".422224.","..4224..",".433334.","24333342","24333342","..4334..",".44..44."],
                ["..4444..",".422224.","..4224..",".433334.","24333342","24333342","..44..4.","...44..."]
            ],
            'left': [
                ["..4444..",".411114.","..42224.","..43334.","..43334.","..433334","..44..44","........"],
                ["..4444..",".411114.","..42224.","..43334.","..43334.","..433334","...44...", "........"]
            ],
            'right': [
                ["..4444..",".411114.","42224..","43334..","43334..","433334..","44..44..","........"],
                ["..4444..",".411114.","42224..","43334..","43334..","433334..","...44...", "........"]
            ]
        };

        function drawPixelArt(startX, startY, artArray, paletteName, pixelSize = 5) {
            const currentPalette = palettes[paletteName];
            for (let r = 0; r < artArray.length; r++) {
                for (let c = 0; c < artArray[r].length; c++) {
                    let colorKey = artArray[r][c];
                    if (colorKey !== '.') {
                        ctx.fillStyle = currentPalette[colorKey];
                        ctx.fillRect(Math.floor(startX) + c * pixelSize, Math.floor(startY) + r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

        const mapData = {
            "Oakhaven": {
                name: "Oakhaven Town",
                // Updated with roof tiles (6)
                grid: [
                    [2,2,2,2,3,3,2,2,2,2],
                    [2,6,6,0,0,0,0,6,6,2],
                    [2,4,4,0,0,0,0,4,4,2],
                    [2,0,0,0,0,0,0,0,0,2],
                    [2,0,5,5,5,5,0,0,0,2],
                    [2,0,5,5,5,5,0,0,0,2],
                    [2,0,0,0,0,0,0,0,0,2],
                    [2,2,0,0,0,0,6,6,2,2],
                    [2,2,0,0,0,0,4,4,2,2],
                    [2,2,2,2,2,2,2,2,2,2]
                ],
                transitions: { "0,4": { map: "Route1", x: 4, y: 8 }, "0,5": { map: "Route1", x: 5, y: 8 } }
            },
            "Route1": {
                name: "Route 1",
                grid: [
                    [2,2,2,2,2,2,2,2,2,2],
                    [2,1,1,2,0,0,1,1,1,2],
                    [2,1,1,2,0,0,2,2,1,2],
                    [2,0,0,0,0,0,0,0,0,2],
                    [2,1,2,2,0,0,1,1,1,2],
                    [2,1,1,1,0,0,1,1,1,2],
                    [2,0,0,0,0,0,0,0,0,2],
                    [2,1,1,1,0,0,2,1,1,2],
                    [2,1,1,1,0,0,2,1,1,2],
                    [2,2,2,2,3,3,2,2,2,2]
                ],
                transitions: { "9,4": { map: "Oakhaven", x: 4, y: 1 }, "9,5": { map: "Oakhaven", x: 5, y: 1 } }
            }
        };

        // ==========================================
        // SMOOTH MOVEMENT & ANIMATION STATE
        // ==========================================
        let currentMapId = "Oakhaven";
        let player = { 
            x: 5 * tileSize, 
            y: 8 * tileSize,
            speed: 3, // slightly faster for responsiveness
            size: 28, // hitbox
            margin: 6,
            // NEW: Animation state
            direction: 'down',
            frame: 0,
            walkTimer: 0
        };
        
        let keys = { w: false, a: false, s: false, d: false };
        let inBattle = false;
        let distanceWalkedInGrass = 0;

        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        function showMapName() {
            const mapLabel = document.getElementById('map-name-display');
            mapLabel.innerText = mapData[currentMapId].name;
            mapLabel.style.display = 'block';
            setTimeout(() => { mapLabel.style.display = 'none'; }, 2000);
        }

        function isSolid(x, y) {
            let col = Math.floor(x / tileSize);
            let row = Math.floor(y / tileSize);
            let grid = mapData[currentMapId].grid;
            if (row < 0 || row >= grid.length || col < 0 || col >= grid[0].length) return true;
            let tile = grid[row][col];
            // Solid: Tree(2), House Wall(4), Water(5), Roof(6)
            return tile === 2 || tile === 4 || tile === 5 || tile === 6;
        }

        function canMoveTo(newX, newY) {
            let left = newX + player.margin;
            let right = newX + player.margin + player.size;
            let top = newY + player.margin;
            let bottom = newY + player.margin + player.size;
            return !isSolid(left, top) && !isSolid(right, top) && !isSolid(left, bottom) && !isSolid(right, bottom);
        }

        function checkEvents() {
            let centerCol = Math.floor((player.x + tileSize/2) / tileSize);
            let centerRow = Math.floor((player.y + tileSize/2) / tileSize);
            let currentTile = mapData[currentMapId].grid[centerRow][centerCol];

            if (currentTile === 3) {
                let transitionKey = `${centerRow},${centerCol}`;
                let t = mapData[currentMapId].transitions[transitionKey];
                if (t) {
                    currentMapId = t.map;
                    player.x = t.x * tileSize; 
                    player.y = t.y * tileSize;
                    showMapName();
                }
            }

            if (currentTile === 1) {
                distanceWalkedInGrass += player.speed;
                if (distanceWalkedInGrass > 50) { // adjusted encounter rate
                    distanceWalkedInGrass = 0;
                    if (Math.random() < 0.12) {
                        keys = { w: false, a: false, s: false, d: false };
                        startBattle();
                    }
                }
            } else {
                distanceWalkedInGrass = 0;
            }
        }

        // ==========================================
        // ENGINE: UPDATE & ANIMATE
        // ==========================================
        function update() {
            if (inBattle) return;

            let moved = false;
            let targetX = player.x;
            let targetY = player.y;

            // Determine direction and target
            if (keys.w) { targetY -= player.speed; player.direction = 'up'; moved = true; }
            else if (keys.s) { targetY += player.speed; player.direction = 'down'; moved = true; }
            
            if (keys.a) { targetX -= player.speed; player.direction = 'left'; moved = true; }
            else if (keys.d) { targetX += player.speed; player.direction = 'right'; moved = true; }

            // Collision & movement
            if (targetX !== player.x && canMoveTo(targetX, player.y)) {
                player.x = targetX;
            }
            if (targetY !== player.y && canMoveTo(player.x, targetY)) {
                player.y = targetY;
            }

            // Handle Animation Frame Swapping
            if (moved) {
                checkEvents();
                player.walkTimer++;
                // Swap frames every 10 update loops (approx 6 times per second)
                if (player.walkTimer > 10) {
                    player.frame = player.frame === 0 ? 1 : 0;
                    player.walkTimer = 0;
                }
            } else {
                // Reset to standing frame if not moving
                player.frame = 0;
                player.walkTimer = 0;
            }
        }

        function drawMap() {
            // Clear canvas entirely
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0,0,canvas.width, canvas.height);

            let activeGrid = mapData[currentMapId].grid;

            // 1. Draw Map Tiles
            for (let y = 0; y < activeGrid.length; y++) {
                for (let x = 0; x < activeGrid[y].length; x++) {
                    let tileType = activeGrid[y][x];
                    let tileDef = tileset[tileType];
                    
                    // Always draw ground/path base first
                    drawPixelArt(x * tileSize, y * tileSize, tileset[0].pixels, tileset[0].palette);
                    
                    // Draw complex tile (grass, tree, house) over the path if it's not the path itself
                    if (tileType !== 0) {
                        drawPixelArt(x * tileSize, y * tileSize, tileDef.pixels, tileDef.palette);
                    }
                }
            }
            
            // 2. Draw Player Sprite (using current direction and animation frame)
            let currentAnimationStrip = playerSprites[player.direction];
            let currentAnimationFrame = currentAnimationStrip[player.frame];
            drawPixelArt(player.x, player.y, currentAnimationFrame, playerSprites.palette);
        }

        function gameLoop() {
            update();
            drawMap();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // BATTLE LOGIC (Updated Colors)
        // ==========================================
        let currentEnemy = null;
        let enemyCurrentHp = 0;

        function startBattle() {
            inBattle = true;
            document.getElementById('battle-screen').style.display = 'flex';
            const randomId = Math.floor(Math.random() * 3) + 1;
            currentEnemy = aetheronDatabase[randomId];
            enemyCurrentHp = Math.floor((currentEnemy.baseHp * 5) / 10); 
            
            document.getElementById('enemy-name').innerText = currentEnemy.name;
            document.getElementById('enemy-sprite').innerText = currentEnemy.sprite;
            document.getElementById('enemy-hp').innerText = enemyCurrentHp;

            let activeAetheron = playerState.party[0];
            document.getElementById('player-aetheron-name').innerText = activeAetheron.name;
            document.getElementById('player-hp').innerText = `${activeAetheron.currentHp}/${activeAetheron.maxHp}`;
            document.getElementById('message-box').innerText = `A wild ${currentEnemy.name} appeared! Go, ${activeAetheron.name}!`;
        }

        function attack() {
            let activeAetheron = playerState.party[0];
            let damage = Math.floor(Math.random() * 4) + Math.floor(activeAetheron.attack / 3);
            enemyCurrentHp -= damage;
            
            if (enemyCurrentHp <= 0) {
                enemyCurrentHp = 0;
                document.getElementById('enemy-hp').innerText = enemyCurrentHp;
                document.getElementById('message-box').innerText = `${currentEnemy.name} fainted!`;
                setTimeout(endBattle, 1500);
            } else {
                document.getElementById('enemy-hp').innerText = enemyCurrentHp;
                document.getElementById('message-box').innerText = `${activeAetheron.name} attacked for ${damage} damage!`;
            }
        }

        function run() {
            document.getElementById('message-box').innerText = "Got away safely!";
            setTimeout(endBattle, 1000);
        }

        function endBattle() {
            inBattle = false;
            document.getElementById('battle-screen').style.display = 'none';
        }

        showMapName();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
